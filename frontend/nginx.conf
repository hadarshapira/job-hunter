server {
    listen 80;
    root /usr/share/nginx/html;

    # Docker's DNS: re-resolve "api" so a restarted API container is found again
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:8000;

    location /api/ {
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # The service worker must never be cached, so app updates arrive
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }

    location ~ \.webmanifest$ {
        default_type application/manifest+json;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}

# Public pages for Google's OAuth review (home + privacy policy).
# Exposed to the internet through Tailscale Funnel on port 8443; nothing else is served here.
server {
    listen 8081;
    root /usr/share/nginx/public;
    add_header Cache-Control "no-cache";

    location = / { try_files /index.html =404; }
    location = /privacy { default_type text/html; try_files /privacy.html =404; }
    location = /style.css { }
    location = /icon.svg { }
    location / { return 404; }
}
