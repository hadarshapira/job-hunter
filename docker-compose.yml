name: job-hunter

services:
  db:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: jobhunter
      POSTGRES_PASSWORD: ${DB_PASSWORD:-jobhunter}
      POSTGRES_DB: jobhunter
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobhunter -d jobhunter"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7
    restart: unless-stopped
    ports:
      - "127.0.0.1:6380:6379"

  api:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://jobhunter:${DB_PASSWORD:-jobhunter}@db:5432/jobhunter
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 5s
      start_period: 30s
      retries: 10
    restart: unless-stopped

  worker:
    build: ./backend
    command: ["arq", "app.worker.WorkerSettings"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://jobhunter:${DB_PASSWORD:-jobhunter}@db:5432/jobhunter
      REDIS_URL: redis://redis:6379/0
    depends_on:
      api:
        condition: service_healthy  # the API runs the database migrations first
    restart: unless-stopped

  web:
    build:
      context: ./frontend
      args:
        CONTACT_EMAIL: ${CONTACT_EMAIL:-}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8088:80"
      - "127.0.0.1:8089:8081"  # public pages (home + privacy), via Tailscale Funnel :8443

volumes:
  dbdata:
